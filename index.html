<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>知域 Zero Trust Portal · 零信任身分與資料治理互動平台 (Vibe Coding 作品)</title>
    <style>
:root {
  color-scheme: light;
  --ink: #17263a;
  --muted: #718096;
  --line: #e2e8f0;
  --paper: #fff;
  --canvas: #f3f6fa;
  --blue: #2459a6;
  --blue-dark: #1b437f;
  --blue-pale: #eaf1fc;
  --teal: #167c76;
  --teal-pale: #e7f5f3;
  --amber: #9b6316;
  --amber-pale: #fff5e5;
  --red: #ad3d46;
  --red-pale: #fff0f1;
  --shadow: 0 8px 28px rgb(25 45 76 / 5%);
  font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
body { min-width: 320px; margin: 0; color: var(--ink); background: var(--canvas); }
button, input, select, textarea { font: inherit; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid rgb(36 89 166 / 28%); outline-offset: 2px;
}
.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed; z-index: 5; inset: 0 auto 0 0; display: flex; width: 252px;
  flex-direction: column; padding: 25px 17px 16px; border-right: 1px solid var(--line);
  background: var(--paper);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 9px 32px; }
.brand-mark {
  display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px;
  color: white; background: linear-gradient(145deg, #2d6bc0, #1b467f); font-size: 19px; font-weight: 800;
}
.brand strong { display: block; font-size: 17px; letter-spacing: .04em; }
.brand small { display: block; margin-top: 3px; color: #98a5b7; font-size: 9px; letter-spacing: .13em; }
.workspace-label { padding: 0 12px 9px; color: #9aa6b7; font-size: 10px; font-weight: 700; letter-spacing: .12em; }
.main-nav { display: grid; gap: 5px; }
.nav-link {
  display: flex; min-height: 43px; align-items: center; gap: 12px; padding: 0 12px;
  border-radius: 9px; color: #617087; font-size: 13px; font-weight: 550;
}
.nav-link:hover { color: var(--blue-dark); background: #f5f8fd; }
.nav-link.active { color: var(--blue-dark); background: var(--blue-pale); font-weight: 700; }
.nav-icon { width: 20px; color: #6982a7; text-align: center; font-size: 16px; }
.nav-count { margin-left: auto; padding: 2px 7px; border-radius: 20px; color: white; background: var(--blue); font-size: 10px; }
.sidebar-bottom { margin-top: auto; }
.security-note {
  display: flex; align-items: center; gap: 10px; margin: 0 4px 13px; padding: 12px 10px;
  border: 1px solid #e5ebf4; border-radius: 10px; background: #f8fafe;
}
.status-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: #328b83; box-shadow: 0 0 0 3px #e1f3f0; }
.security-note strong, .security-note small { display: block; }
.security-note strong { font-size: 11px; }
.security-note small { margin-top: 4px; color: var(--muted); font-size: 9px; }
.profile-button {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 7px;
  border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer;
}
.avatar { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 50%; color: #254a80; background: #e8eef8; font-size: 12px; font-weight: 750; }
.avatar-small { width: 32px; height: 32px; cursor: pointer; }
.profile-copy { min-width: 0; flex: 1; }
.profile-copy strong, .profile-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-copy strong { font-size: 11px; }
.profile-copy small { margin-top: 4px; color: var(--muted); font-size: 10px; }
.profile-chevron { color: #8796a9; }
.main-area { min-height: 100vh; margin-left: 252px; }
.topbar {
  position: sticky; z-index: 4; top: 0; display: flex; height: 64px; align-items: center;
  justify-content: space-between; padding: 0 36px; border-bottom: 1px solid var(--line);
  background: rgb(255 255 255 / 95%); backdrop-filter: blur(12px);
}
.breadcrumbs { display: flex; align-items: center; gap: 10px; color: #8997a9; font-size: 11px; }
.breadcrumbs strong { color: #34465f; font-weight: 650; }
.crumb-separator { color: #c5cfdd; }
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.mode-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid; border-radius: 20px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.mode-pill::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
.mode-demo { border-color: #f0dfc3; color: var(--amber); background: #fffaf1; }
.mode-connected { border-color: #c9e7df; color: #167c76; background: #eff9f6; }
.session-button { min-height: 32px !important; padding: 0 10px !important; font-size: 10px !important; }
.icon-button { display: inline-grid; width: 32px; height: 32px; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: #697b93; background: #fff; cursor: pointer; }
.icon-button:hover { color: var(--blue); border-color: #b9cce7; }
.mobile-menu { display: none; }
.content-wrap { display: flex; max-width: 1360px; min-height: calc(100vh - 64px); flex-direction: column; margin: auto; padding: 32px 38px 20px; }
#page-content { flex: 1; }
.page-footer { display: flex; justify-content: space-between; gap: 14px; padding-top: 22px; color: #95a2b3; font-size: 9px; }
.footer-separator { padding: 0 5px; }
.page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 10px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(23px, 3vw, 30px); font-weight: 730; letter-spacing: -.035em; }
.page-subtitle { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
.button { display: inline-flex; min-height: 37px; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border: 1px solid transparent; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
.button-primary { color: #fff; background: var(--blue); box-shadow: 0 3px 8px rgb(36 89 166 / 15%); }
.button-primary:hover { background: var(--blue-dark); }
.button-secondary { border-color: #dce4ef; color: #526681; background: #fff; }
.button-secondary:hover { border-color: #b7cae5; color: var(--blue-dark); }
.button-danger { border-color: #f0d6d8; color: var(--red); background: #fff; }
.button-danger:hover { background: var(--red-pale); }
.button:disabled { opacity: .55; cursor: not-allowed; }
.stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin: 18px 0; }
.stat-grid-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat-card, .panel { border: 1px solid var(--line); border-radius: 11px; background: var(--paper); box-shadow: var(--shadow); }
.stat-card { position: relative; min-height: 110px; overflow: hidden; padding: 16px; }
.stat-card::after { position: absolute; top: -24px; right: -17px; width: 62px; height: 62px; border-radius: 50%; background: var(--blue-pale); content: ""; }
.stat-top { display: flex; align-items: center; justify-content: space-between; color: #8190a5; font-size: 10px; }
.stat-icon { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 8px; color: var(--blue); background: var(--blue-pale); font-size: 15px; }
.stat-value { margin-top: 10px; font-size: 24px; font-weight: 730; letter-spacing: -.04em; }
.stat-foot { margin-top: 3px; color: #929eaf; font-size: 9px; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(250px, .9fr); gap: 15px; }
.panel { overflow: hidden; }
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid #edf1f6; }
.panel-header h2 { margin: 0; font-size: 12px; font-weight: 720; }
.panel-header p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
.text-link { border: 0; color: var(--blue); background: transparent; font-size: 10px; font-weight: 700; cursor: pointer; }
.quick-list { display: grid; gap: 8px; padding: 14px; }
.quick-action { display: flex; align-items: center; gap: 11px; padding: 12px; border: 1px solid #e8edf4; border-radius: 9px; background: #fff; text-align: left; cursor: pointer; }
.quick-action:hover { border-color: #c4d5ea; background: #f9fbfe; }
.action-icon, .doc-icon { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 9px; color: var(--blue); background: var(--blue-pale); font-size: 15px; }
.quick-action strong, .quick-action small { display: block; }
.quick-action strong { font-size: 10px; }
.quick-action small { margin-top: 4px; color: var(--muted); font-size: 9px; }
.notice-banner { display: flex; align-items: center; gap: 12px; margin-bottom: 17px; padding: 12px 14px; border: 1px solid; border-radius: 10px; font-size: 10px; line-height: 1.6; }
.notice-banner > div { flex: 1; }
.notice-banner strong { display: block; font-size: 11px; }
.notice-banner p { margin: 3px 0 0; }
.notice-icon { display: grid; width: 27px; height: 27px; flex: 0 0 auto; place-items: center; border-radius: 8px; font-size: 13px; font-weight: 800; }
.notice-demo { border-color: #f0e1c8; color: #80633e; background: #fffaf2; }
.notice-demo .notice-icon { color: var(--amber); background: #ffefcf; }
.notice-live { border-color: #cce8df; color: #246b62; background: #f0faf7; }
.notice-live .notice-icon { color: var(--teal); background: #dff3ee; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th { padding: 11px 14px; color: #8290a3; background: #f8fafd; font-size: 9px; font-weight: 700; white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid #edf1f6; color: #52637b; font-size: 10px; vertical-align: middle; }
tbody tr:hover { background: #fafcff; }
.primary-cell { color: #293b54; font-weight: 650; }
.secondary-cell { display: block; margin-top: 4px; color: #909db0; font-size: 9px; font-weight: 400; }
.reason-cell { min-width: 180px; max-width: 340px; line-height: 1.6; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 20px; font-size: 9px; font-weight: 700; white-space: nowrap; }
.badge::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
.badge-approved, .badge-active, .badge-allow { color: #237656; background: #e8f5ee; }
.badge-pending { color: #9a641d; background: #fff3de; }
.badge-rejected, .badge-revoked, .badge-deny { color: #a4484e; background: #fff0f1; }
.badge-expired, .badge-unknown { color: #758397; background: #eef1f5; }
.filter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; }
.filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-chip { padding: 6px 9px; border: 1px solid #e3e9f1; border-radius: 20px; color: #758398; background: #fff; font-size: 9px; cursor: pointer; }
.filter-chip.active { border-color: #c2d4ec; color: var(--blue-dark); background: var(--blue-pale); font-weight: 700; }
.search-label { color: #65758b; font-size: 10px; font-weight: 700; }
.search-input { width: min(260px, 55vw); min-height: 35px; padding: 0 11px; border: 1px solid #dfe6ef; border-radius: 7px; outline: none; font-size: 11px; }
.search-input:focus, .form-control:focus { border-color: #80a5d3; box-shadow: 0 0 0 3px rgb(36 89 166 / 9%); }
.doc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; margin-top: 14px; }
.doc-card { display: flex; min-height: 195px; flex-direction: column; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: var(--shadow); }
.doc-card-top { display: flex; align-items: center; justify-content: space-between; }
.doc-card .eyebrow { margin-top: 14px; margin-bottom: 0; }
.doc-card h3 { margin: 7px 0 5px; font-size: 12px; }
.doc-card p:not(.eyebrow) { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
.doc-card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 15px; }
.doc-card-bottom small { color: #98a4b4; font-size: 9px; }
.lock-note { margin-top: 13px; padding: 11px 13px; border: 1px solid #f0e4d3; border-radius: 8px; color: #806c50; background: #fffaf3; font-size: 10px; line-height: 1.6; }
.empty-state { padding: 30px 15px; color: #8492a6; text-align: center; font-size: 10px; }
.empty-state strong { display: block; margin-bottom: 5px; color: #42556e; font-size: 12px; }
.empty-state p { margin: 5px 0 13px; }
.empty-icon { display: grid; width: 40px; height: 40px; place-items: center; margin: 0 auto 10px; border-radius: 12px; color: #527aab; background: var(--blue-pale); font-size: 17px; }
.empty-inline { padding: 0 5px; color: var(--muted); font-size: 11px; }
.inline-form { display: flex; align-items: flex-end; gap: 12px; padding: 18px; }
.inline-form .form-field { flex: 1; margin: 0; }
.result-panel, .section-panel { margin-top: 15px; }
.document-output { margin: 0; padding: 17px; color: #34465f; font: inherit; white-space: pre-wrap; }
.row-actions { display: flex; gap: 5px; }
.section-panel .panel-header + .table-wrap { border-radius: 0 0 10px 10px; }
.admin-forms { align-items: start; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-panel { min-width: 0; }
.form-body { display: grid; gap: 12px; padding: 15px; }
.form-field { display: grid; gap: 7px; margin: 0; }
.form-field > span { color: #52637b; font-size: 10px; font-weight: 700; }
.form-control { width: 100%; min-height: 37px; padding: 9px 10px; border: 1px solid #dfe6ef; border-radius: 7px; outline: none; background: #fff; color: var(--ink); font-size: 11px; }
textarea.form-control { min-height: 86px; resize: vertical; }
.check-row { display: flex; align-items: center; gap: 8px; color: #52637b; font-size: 10px; }
.check-row input { accent-color: var(--blue); }
.modal-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 20px; background: rgb(18 34 56 / 42%); backdrop-filter: blur(3px); }
.modal-backdrop[hidden] { display: none; }
.modal { width: min(100%, 480px); max-height: min(90vh, 720px); overflow-y: auto; padding: 22px; border: 1px solid #e8edf4; border-radius: 13px; background: #fff; box-shadow: 0 20px 65px rgb(0 0 0 / 17%); }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 18px; }
.modal-header h2 { margin: 0; font-size: 17px; }
.modal-header p { margin: 6px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
.modal-close { width: 29px; height: 29px; border: 0; border-radius: 7px; color: #77869a; background: #f1f4f8; cursor: pointer; }
.modal form { display: grid; gap: 13px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px; }
.role-options { display: grid; gap: 8px; }
.role-option { display: flex; align-items: center; gap: 11px; padding: 11px; border: 1px solid #e5eaf1; border-radius: 8px; text-align: left; background: #fff; cursor: pointer; }
.role-option:hover, .role-option.selected { border-color: #b8cce5; background: #f6f9fe; }
.role-option .role-emoji { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 8px; background: #edf2f9; }
.role-option strong, .role-option small { display: block; }
.role-option strong { font-size: 11px; }
.role-option small { margin-top: 4px; color: var(--muted); font-size: 9px; }
.modal-warning { padding: 10px; border: 1px solid #f0e2c9; border-radius: 8px; color: #80633e; background: #fff9ee; font-size: 9px; line-height: 1.65; }
.notice-card { padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: #f9fbfe; }
.notice-card strong { display: block; font-size: 11px; }
.notice-card p { margin: 6px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
.settings-list { display: grid; gap: 1px; padding: 0 4px; }
.settings-row { display: flex; justify-content: space-between; gap: 15px; padding: 13px 2px; border-bottom: 1px solid #edf1f6; }
.settings-row:last-child { border-bottom: 0; }
.settings-row strong, .settings-row small { display: block; }
.settings-row strong { font-size: 10px; }
.settings-row small { margin-top: 4px; color: var(--muted); font-size: 9px; }
.loading-indicator { position: sticky; z-index: 3; top: 70px; margin-bottom: 12px; padding: 9px 12px; border: 1px solid #d8e5f4; border-radius: 8px; color: var(--blue-dark); background: #f3f8ff; font-size: 10px; }
.loading-indicator[hidden] { display: none; }
.toast-region { position: fixed; z-index: 30; right: 22px; bottom: 20px; display: grid; gap: 8px; }
.toast { min-width: 220px; max-width: min(420px, calc(100vw - 40px)); padding: 11px 14px; border: 1px solid #cfe6dc; border-radius: 8px; color: #246b54; background: #fff; box-shadow: 0 8px 25px rgb(30 54 43 / 13%); font-size: 10px; line-height: 1.55; }
.toast.error { border-color: #f0d6d8; color: var(--red); }

@media (max-width: 1080px) {
  .content-wrap { padding: 28px 24px 17px; }
  .topbar { padding: 0 24px; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .doc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .admin-forms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .sidebar { transform: translateX(-105%); box-shadow: 8px 0 30px rgb(20 32 56 / 10%); }
  .sidebar.open { transform: translateX(0); }
  .main-area { margin-left: 0; }
  .mobile-menu { display: inline-grid; }
  .topbar { height: 58px; justify-content: flex-start; gap: 11px; padding: 0 14px; }
  .topbar-actions { gap: 7px; margin-left: auto; }
  .content-wrap { min-height: calc(100vh - 58px); padding: 23px 14px 14px; }
  .page-heading { align-items: flex-start; flex-direction: column; margin-bottom: 18px; }
  .dashboard-grid, .admin-forms { grid-template-columns: 1fr; }
  .page-footer { flex-direction: column; gap: 6px; }
  .session-button { padding: 0 8px !important; }
}
@media (max-width: 480px) {
  .stat-card { min-height: 98px; padding: 12px; }
  .stat-value { font-size: 21px; }
  .doc-grid, .stat-grid { grid-template-columns: 1fr; }
  .filter-row { align-items: stretch; flex-direction: column; }
  .search-input { width: 100%; }
  .table-wrap table { min-width: 620px; }
  .inline-form { align-items: stretch; flex-direction: column; }
  .inline-form .button { width: 100%; }
  .mode-pill { padding: 5px 7px; font-size: 9px; }
  .session-button { min-width: 57px; font-size: 9px !important; }
  #help-button { display: none; }
}

/* =========================================================
   階段一：登入介面與使用流程設計 (Mock 狀態與視覺元件)
   ========================================================= */

/* Mock 測試切換工具列 (可展開/收合) */
.mock-toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #111a28;
  color: #c9d6e8;
  border-bottom: 1px solid #23344d;
  font-size: 11px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}
.mock-toolbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 18px;
  gap: 12px;
  flex-wrap: wrap;
}
.mock-toolbar-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 700;
  color: #6bb0ff;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.mock-toolbar-badge {
  background: #1e3656;
  color: #9eccff;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
}
.mock-toolbar-buttons {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.mock-btn {
  background: #1e2c40;
  color: #e2ecf9;
  border: 1px solid #324765;
  border-radius: 6px;
  padding: 4px 9px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.mock-btn:hover {
  background: #2a3d58;
  border-color: #5375a3;
  color: #fff;
}
.mock-btn.active {
  background: #2459a6;
  border-color: #4681d4;
  color: #ffffff;
  box-shadow: 0 0 0 2px rgba(36, 89, 166, 0.4);
}
.mock-btn-danger {
  color: #ff9da4;
  border-color: #692a30;
  background: #2b171a;
}
.mock-btn-danger:hover {
  background: #3e1e23;
  border-color: #943a44;
  color: #fff;
}
.mock-btn-warning {
  color: #ffd080;
  border-color: #5c441c;
  background: #281d0f;
}
.mock-btn-warning:hover {
  background: #3c2a13;
  border-color: #8c6729;
  color: #fff;
}
.mock-toolbar-toggle {

  function evaluateDocumentAccess(tier, docId) {
    const doc = catalogDocuments[docId];
    const actor = currentActor();
    if (!doc) {
      recordAudit(actor, `read_${tier}_document`, docId, "deny", "document_not_found");
      return { allowed: false, status: 404, code: "document_not_found", message: `找不到文件 ID「${docId}」。` };
    }
    if (tier === "public") {
      if (doc.restricted) {
        recordAudit(actor, "read_public_document", docId, "deny", "classification_mismatch");
        return { allowed: false, status: 403, code: "classification_mismatch", message: `「${docId}」屬於受限機密資源，不可透過公開端點讀取，請切換為「受限敏感文件」端點。` };
      }
      recordAudit(actor, "read_public_document", docId, "allow", "public_document_read");
      return { allowed: true, status: 200, code: "public_document_read", doc };
    }

    // Restricted document evaluation (OPA authz.rego rules)
    if (!isAuthenticated()) {
      recordAudit(actor, "read_restricted_document", docId, "deny", "unauthenticated_reader_denied");
      return { allowed: false, status: 401, code: "unauthenticated_reader_denied", message: "未登入訪客 (Reader) 無法存取受限研究資源。請先登入 Alice (Requester)。" };
    }
    if (store.accounts[actor] !== "active") {
      recordAudit(actor, "read_restricted_document", docId, "deny", "account_disabled");
      return { allowed: false, status: 403, code: "account_disabled", message: `帳號「${actor}」已被管理員停用 (disabled)，PEP 已立即阻斷所有存取。` };
    }
    if (state.role !== "requester") {
      recordAudit(actor, "read_restricted_document", docId, "deny", "role_not_requester");
      return { allowed: false, status: 403, code: "role_not_requester", message: `目前角色為「${roles[state.role]?.label}」；依職責分離原則，僅 Requester (alice) 可讀取受限研究資料集。` };
    }
    if (!state.mfaVerified || !state.deviceTrusted) {
      recordAudit(actor, "read_restricted_document", docId, "deny", "mfa_or_device_untrusted");
      return {
        allowed: false,
        status: 403,
        code: "mfa_or_device_untrusted",
        message: `零信任強驗證未通過（MFA=${state.mfaVerified}, device_trusted=${state.deviceTrusted}）。請點擊右上角信號膠囊開啟 MFA 與裝置信任。`
      };
    }
    const resourcePolicy = store.resources.find((r) => r.resource_scope === docId);
    if (resourcePolicy && resourcePolicy.status !== "active") {
      recordAudit(actor, "read_restricted_document", docId, "deny", "resource_disabled");
      return { allowed: false, status: 403, code: "resource_disabled", message: `資源「${docId}」目前已被管理員停用 (disabled)。` };
    }
    const activeGrant = store.grants.find(
      (g) => g.subject === actor && g.resource_scope === docId && g.status === "active" && new Date(g.expires_at) > new Date()
    );
    if (!activeGrant) {
      recordAudit(actor, "read_restricted_document", docId, "deny", "missing_active_grant");
      return {
        allowed: false,
        status: 403,
        code: "missing_active_grant",
        message: `拒絕存取：Alice 目前沒有「${docId}」的有效授權 (Grant)。請先提出存取申請並由 Bob 核准（或若剛被撤銷，請重新申請）。`
      };
    }

    recordAudit(actor, "read_restricted_document", docId, "allow", "restricted_document_authorized");
    return { allowed: true, status: 200, code: "restricted_document_authorized", doc, grant: activeGrant };
  }

  function openModal(markup) {
    modal.innerHTML = markup;
    modalBackdrop.hidden = false;
    modal.querySelectorAll("[data-close]").forEach((btn) => btn.addEventListener("click", closeModal));
    modalBackdrop.onclick = (event) => { if (event.target === modalBackdrop) closeModal(); };
  }

  function closeModal() {
    modalBackdrop.hidden = true;
    modal.innerHTML = "";
    modalBackdrop.onclick = null;
  }

  function switchRole(newRole, mfaMethod = state.mfaMethod) {
    state.mockView = "normal";
    state.role = newRole;
    state.mfaMethod = mfaMethod;
    state.mfaVerified = true;
    state.deviceTrusted = true;
    state.documentResult = null;
    if (newRole === "reader") {
      state.page = "dashboard";
      toast("已切換為：未登入訪客 (預設 Reader · 無申請頁面)");
    } else if (newRole === "requester") {
      state.page = "requests";
      recordAudit("alice", "oidc_login_success", "zt-portal", "allow", `mfa_${mfaMethod.includes("FIDO2") ? "webauthn" : "totp"}`);
      toast(`已登入：Alice (Requester) · 驗證方式：${mfaMethod}`);
    } else if (newRole === "reviewer") {
      state.page = "review";
      recordAudit("bob", "oidc_login_success", "zt-portal", "allow", `mfa_${mfaMethod.includes("FIDO2") ? "webauthn" : "totp"}`);
      toast(`已登入：Bob (Reviewer 審核委員) · 驗證方式：${mfaMethod}`);
    } else if (newRole === "administrator") {
      state.page = "admin";
      recordAudit("bob", "oidc_login_success", "zt-portal", "allow", `mfa_${mfaMethod.includes("FIDO2") ? "webauthn" : "totp"}`);
      toast(`已登入：Bob (Administrator 管理員) · 驗證方式：${mfaMethod}`);
    }
    closeModal();
    render();
  }

  function openReviewModal(id, decision) {

    if (!req) return toast("找不到該筆申請單。", true);
    const approve = decision === "approve";
    openModal(`
      <div class="modal-header">
        <div>
          <p class="eyebrow">申請審核 · Bob (Reviewer)</p>
          <h2 id="modal-title">${approve ? "核准" : "拒絕"}存取申請 (${escapeHtml(req.id)})</h2>
          <p>申請者：<code>${escapeHtml(req.subject)}</code> · 目標資源：<code>${escapeHtml(req.resource_scope)}</code></p>
        </div>
        <button class="modal-close" data-close aria-label="關閉">×</button>
      </div>
      <div class="decision-detail-box" style="margin-bottom: 12px;">
        <div class="decision-row"><span class="label">申請原因：</span><span class="val">${escapeHtml(req.reason)}</span></div>
      </div>
      <form id="review-form" data-id="${escapeHtml(id)}" data-decision="${decision}">
        <label class="form-field">
          <span>審核意見（必填，寫入稽核紀錄）</span>
          <textarea class="form-control" name="reason" required maxlength="500">${approve ? "確認研究用途符合最小特權原則，核准發放臨時存取授權 (Grant)。" : "申請理由未盡明確，予以退件。"}</textarea>

        </div>
      </form>
    `);

  function handleForm(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const data = new FormData(form);
    const values = Object.fromEntries(data.entries());

    if (form.id === "request-form") {
      if (store.accounts.alice !== "active") {
        recordAudit("alice", "create_access_request", String(values.resource_scope), "deny", "account_disabled");
        toast("申請遭拒：Alice 帳號目前已被管理員停用 (disabled)。", true);
        closeModal();
        return;
      }
      const scope = String(values.resource_scope).trim();
      const reason = String(values.reason).trim();
      const resPolicy = store.resources.find((r) => r.resource_scope === scope);
      if (!resPolicy || resPolicy.status !== "active") {
        recordAudit("alice", "create_access_request", scope, "deny", "resource_disabled");
        toast(`申請遭拒：資源「${scope}」目前已停用。`, true);
        closeModal();
        return;
      }
      const reqId = `REQ-2026-${Math.floor(102 + Math.random() * 890)}`;
      const canAutoApprove = !store.reviewMode.review_required &&
                             resPolicy.sensitivity === "low" &&
                             resPolicy.auto_approval_enabled &&
                             state.mfaVerified &&
                             state.deviceTrusted;

      if (canAutoApprove) {
        const grantId = `GRANT-AUTO-${Math.floor(100 + Math.random() * 899)}`;
        store.grants.unshift({
          id: grantId,
          subject: "alice",
          resource_scope: scope,
          expires_at: "2026-12-31T23:59:00Z",
          status: "active",
        });
        store.requests.unshift({
          id: reqId,
          subject: "alice",
          resource_scope: scope,
          reason,
          status: "approved",
          created_at: new Date().toISOString(),
          requested_expires_at: "2026-12-31T23:59:00Z",
          reviewed_by: "OPA Auto-Approval",
          grant_id: grantId,
        });
        recordAudit("alice", "create_access_request", `${reqId}:${scope}`, "allow", "low_risk_auto_approved");
        saveStore();
        closeModal();
        render();
        toast(`🎉 已通過 OPA 低風險自動核准！已立即核發「${scope}」授權 (${grantId})，可直接讀取文件！`);
      } else {
        store.requests.unshift({
          id: reqId,
          subject: "alice",
          resource_scope: scope,
          reason,
          status: "pending",
          created_at: new Date().toISOString(),
          requested_expires_at: "2026-12-31T23:59:00Z",
          reviewed_by: "",
          grant_id: "",
        });
        recordAudit("alice", "create_access_request", `${reqId}:${scope}`, "allow", "manual_review_required");
        saveStore();
        closeModal();
        render();
        toast(`已送出「${scope}」申請單 (${reqId})！現在可點上方「✓ 登入 Bob (審核者)」進行審核。`);
      }
      return;
    }

    if (form.id === "review-form") {
      if (!state.mfaVerified || !state.deviceTrusted) {
        recordAudit("bob", "review_access_request", form.dataset.id, "deny", "mfa_or_device_untrusted");
        toast("審核遭拒：Reviewer 執行審核時必須具備 MFA 與受信任裝置信號。", true);
        return;
      }
      const req = store.requests.find((r) => r.id === form.dataset.id);
      if (!req) return;
      const approve = form.dataset.decision === "approve";
      req.status = approve ? "approved" : "rejected";
      req.reviewed_by = "bob";
      if (approve) {
        const grantId = `GRANT-2026-${Math.floor(100 + Math.random() * 899)}`;
        req.grant_id = grantId;
        store.grants.unshift({
          id: grantId,
          subject: req.subject,
          resource_scope: req.resource_scope,
          expires_at: "2026-12-31T23:59:00Z",
          status: "active",
        });
        recordAudit("bob", "approve_access_request", `${req.id}:${req.resource_scope}`, "allow", "reviewer_approved_grant_issued");
        toast(`已核准申請並核發授權 (${grantId})！現在切回 Alice 即可讀取「${req.resource_scope}」！`);
      } else {
        recordAudit("bob", "reject_access_request", `${req.id}:${req.resource_scope}`, "allow", "reviewer_rejected");
        toast(`已拒絕申請單 ${req.id}。`);
      }
      saveStore();
      closeModal();
      render();
      return;
    }

    const formType = form.dataset.form;
    if (formType === "read-document") {
      state.selectedDocTier = String(values.document_tier || "public");
      state.selectedDocId = String(values.document_id || "").trim();
      state.documentResult = evaluateDocumentAccess(state.selectedDocTier, state.selectedDocId);
      render();
      if (state.documentResult.allowed) {
        toast(`驗證通過 (HTTP 200)：成功讀取 ${state.selectedDocId}`);
      } else {
        toast(`存取遭拒 (HTTP ${state.documentResult.status})：${state.documentResult.code}`, true);
      }
      return;
    }

    if (formType === "review-mode") {
      if (!state.mfaVerified || !state.deviceTrusted) {
        toast("變更審核模式失敗：需通過 MFA 與受信任裝置驗證。", true);
        return;
      }
      store.reviewMode.review_required = String(values.review_required) === "true";
      store.reviewMode.updated_by = "bob (Reviewer)";
      store.reviewMode.updated_at = new Date().toISOString();
      recordAudit("bob", "update_review_mode", "global", "allow", store.reviewMode.review_required ? "manual_mode_enabled" : "auto_approval_mode_enabled");
      saveStore();
      render();
      toast(`已更新全域審核模式為：${store.reviewMode.review_required ? "人工審核" : "低風險自動核准"}`);
      return;
    }

    if (formType === "resource") {
      const scope = String(values.resource_scope).trim();
      const sensitivity = String(values.sensitivity);
      const autoEnabled = data.has("auto_approval_enabled");
      if (autoEnabled && sensitivity !== "low") {
        toast("OPA 政策限制：只有低敏感度 (low) 資源才允許啟用自動核准！", true);
        return;
      }
      const existing = store.resources.find((r) => r.resource_scope === scope);
      if (existing) {
        existing.sensitivity = sensitivity;
        existing.auto_approval_enabled = autoEnabled;
        existing.status = String(values.status);
      }
      recordAudit("bob", "upsert_resource_policy", scope, "allow", "admin_resource_updated");
      saveStore();
      render();
      toast(`已更新資源「${scope}」政策設定。`);
      return;
    }

    if (formType === "account") {
      const subj = String(values.subject);
      const st = String(values.status);
      store.accounts[subj] = st;
      recordAudit("bob", "update_account_status", `${subj}:${st}`, "allow", "admin_account_status_changed");
      saveStore();
      render();
      toast(`已將帳號「${subj}」狀態更新為：${st}`);
    }
  }

  function renderPermissionDenied() {
    appShell.className = "app-shell layout-fullscreen";
    content.innerHTML = `
      <div class="error-panel-wrap">
        <div class="status-state-card">
          <div class="status-state-icon state-icon-denied">⛔</div>
          <h2>HTTP 403 Forbidden：OPA 零信任政策攔截</h2>
          <p class="lead">FastAPI PEP 已驗證您的身分，但 OPA Policy Decision Point 判定本次請求不符合最小特權或強驗證條件，已拒絕存取並寫入稽核軌跡。</p>
          <div class="decision-detail-box">
            <div class="decision-row"><span class="label">評估規則 (Rego Rule)：</span><span class="val">data.zerotrust.authz.restricted_document_decision</span></div>
            <div class="decision-row"><span class="label">決策結果 (Decision)：</span><span class="val" style="color:#ad3d46;font-weight:700;">deny (HTTP 403)</span></div>
            <div class="decision-row"><span class="label">原因代碼 (Reason Code)：</span><span class="val">missing_active_grant_or_mfa</span></div>
            <div class="decision-row"><span class="label">目前身分 (Subject)：</span><span class="val">${escapeHtml(currentSubjectDisplay())}</span></div>
          </div>
          <div class="status-card-actions">
            <button class="button button-primary" type="button" data-action="back-normal">返回治理儀表板</button>
          </div>
        </div>
      </div>`;
  }

  function renderConnectionError() {
    appShell.className = "app-shell layout-fullscreen";
    content.innerHTML = `
      <div class="error-panel-wrap">
        <div class="status-state-card">
          <div class="status-state-icon state-icon-error">⚠️</div>
          <h2>HTTP 503：PEP / PDP Fail-Closed 安全保護啟動</h2>
          <p class="lead">當策略決策引擎 (OPA PDP) 無回應或回傳格式異常時，零信任架構強制執行「預設拒絕 (Fail-Closed)」，絕不因系統故障而放行未授權請求。</p>
          <div class="decision-detail-box">
            <div class="decision-row"><span class="label">防護機制：</span><span class="val">Fail-Closed Enforcement</span></div>
            <div class="decision-row"><span class="label">原因代碼：</span><span class="val">pdp_unavailable_or_invalid</span></div>
            <div class="decision-row"><span class="label">安全動作：</span><span class="val">立即阻斷請求並記錄高優先級異常事件</span></div>
          </div>
          <div class="status-card-actions">
            <button class="button button-primary" type="button" data-action="back-normal">返回治理儀表板</button>
          </div>
        </div>
      </div>`;
  }

  function render() {
    renderNav();
    renderProfile();
    if (state.mockView === "permission-denied") {
      renderPermissionDenied();
      return;
    }
    if (state.mockView === "connection-error") {
      renderConnectionError();
      return;
    }
    appShell.className = "app-shell";
    const allowedPages = navItems.filter((item) => item.roles.includes(state.role)).map((i) => i.id);
    if (!allowedPages.includes(state.page)) {
      state.page = "dashboard";
    }
    const pages = {
      dashboard: dashboardPage,
      documents: documentsPage,
      requests: requestsPage,
      review: reviewerPage,
      admin: adminPage,
    };
    content.innerHTML = pages[state.page]();
    content.querySelectorAll("form").forEach((form) => form.addEventListener("submit", handleForm));
    content.querySelectorAll("[data-filter]").forEach((btn) => btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      render();
    }));
  }

  document.body.addEventListener("click", (event) => {
    const pageLink = event.target.closest("[data-page]");
    if (pageLink) {
      event.preventDefault();
      const targetPage = pageLink.dataset.page;
      const item = navItems.find((i) => i.id === targetPage);
      if (!item || !item.roles.includes(state.role)) {
        toast("目前角色無權開啟此頁面，請先切換對應角色登入。", true);
        return;
      }
      state.mockView = "normal";
      state.page = targetPage;
      document.querySelector("#sidebar").classList.remove("open");
      render();
      return;
    }

    const presetBtn = event.target.closest("[data-doc-preset]");
    if (presetBtn) {
      state.selectedDocId = presetBtn.dataset.docPreset;
      state.selectedDocTier = presetBtn.dataset.docTier;
      if (presetBtn.dataset.autoRead === "true") {
        state.documentResult = evaluateDocumentAccess(state.selectedDocTier, state.selectedDocId);
      }
      render();
      return;
    }

    const actionBtn = event.target.closest("[data-action]");
    if (actionBtn) {
      const act = actionBtn.dataset.action;
      if (act === "open-login-modal") return openLoginSimulatorModal();
      if (act === "logout-reader") return switchRole("reader");
      if (act === "login-alice-quick") return switchRole("requester");
      if (act === "restore-trust") {
        state.mfaVerified = true;
        state.deviceTrusted = true;
        state.documentResult = evaluateDocumentAccess(state.selectedDocTier, state.selectedDocId);
        render();
        toast("已恢復 MFA 與受信任裝置信號！");
        return;
      }
      if (act === "toggle-mfa") {
        state.mfaVerified = !state.mfaVerified;
        render();
        toast(state.mfaVerified ? "已模擬：MFA 驗證通過 (true)" : "已模擬：MFA 未通過 (false) · 受限文件與審核將被攔截", !state.mfaVerified);
        return;
      }
      if (act === "toggle-device") {
        state.deviceTrusted = !state.deviceTrusted;
        render();
        toast(state.deviceTrusted ? "已模擬：受信任裝置 (device_trusted=true)" : "已模擬：未知裝置 (device_trusted=false) · 受限操作將被攔截", !state.deviceTrusted);
        return;
      }
      if (act === "request") return openRequestModal(actionBtn.dataset.scope || "dataset-a17");
      if (act === "request-from-doc") {
        const input = document.querySelector("#doc-id-input");
        return openRequestModal(input ? input.value.trim() : "dataset-a17");
      }
      if (act === "read-restricted-shortcut") {
        state.page = "documents";
        state.selectedDocTier = "restricted";
        state.selectedDocId = actionBtn.dataset.scope || "dataset-a17";
        state.documentResult = evaluateDocumentAccess("restricted", state.selectedDocId);
        render();
        return;
      }
      if (act === "review") {
        return openReviewModal(actionBtn.dataset.id, actionBtn.dataset.decision);
      }
      if (act === "revoke") {
        const grant = store.grants.find((g) => g.id === actionBtn.dataset.id);
        if (grant) {
          grant.status = "revoked";
          const relatedReq = store.requests.find((r) => r.grant_id === grant.id);
          if (relatedReq) relatedReq.status = "revoked";
          recordAudit("bob", "revoke_grant", `${grant.id}:${grant.resource_scope}`, "allow", "grant_revoked_immediately");
          saveStore();
          render();
          toast(`已立即撤銷授權 ${grant.id} (${grant.resource_scope})！切回 Alice 讀取將立即被 403 攔截。`);
        }
        return;
      }
      if (act === "reset-data") {
        store = defaultStore();
        saveStore();
        state.documentResult = null;
        render();
        toast("已重置所有示範申請、授權與稽核紀錄！");
        return;
      }
      if (act === "back-normal") {
        state.mockView = "normal";
        render();
        return;
      }
    }
  });

  document.querySelector("#mock-toolbar-buttons").addEventListener("click", (event) => {
    const btn = event.target.closest("[data-role-switch]");
    if (!btn) return;
    const target = btn.dataset.roleSwitch;
    if (["reader", "requester", "reviewer", "administrator"].includes(target)) {
      switchRole(target);
    } else if (target === "login-modal") {
      openLoginSimulatorModal();
    } else if (target === "permission-denied") {
      state.mockView = "permission-denied";
      render();
      toast("預覽：HTTP 403 政策攔截畫面");
    } else if (target === "connection-error") {
      state.mockView = "connection-error";
      render();
      toast("預覽：HTTP 503 Fail-Closed 保護畫面");
    } else if (target === "reset-data") {
      store = defaultStore();
      saveStore();
      state.documentResult = null;
      render();
      toast("已重置所有示範資料！");
    }
  });

  document.querySelector("#oidc-quick-button").addEventListener("click", openLoginSimulatorModal);
  document.querySelector("#session-button").addEventListener("click", () => switchRole("reader"));
  document.querySelector("#profile-button").addEventListener("click", openLoginSimulatorModal);
  document.querySelector("#top-avatar").addEventListener("click", openLoginSimulatorModal);
  document.querySelector("#mobile-menu-button").addEventListener("click", () => {
    document.querySelector("#sidebar").classList.toggle("open");
  });

  render();
})();
    </script>
  </body>
</html>
